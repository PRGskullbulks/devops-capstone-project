name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nose2 coverage flake8 pylint

      - name: Run Flake8 linting
        run: |
          flake8 service/ tests/

      - name: Run Pylint code quality check
        run: |
          pylint service/ --disable=E1101 --fail-under=7.0 || true

      - name: Run nosetests with coverage
        env:
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/accounts
        run: |
          python -m nose2 -v --coverage service

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
